[package]
name = "yr-app"
description = "OpenYR native window: pan/zoom map view (winit + pixels)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "openyr"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yr-render = { path = "../yr-render" }
yr-assets = { path = "../yr-assets" }
yr-formats = { path = "../yr-formats" }
yr-rules = { path = "../yr-rules" }
yr-sim = { path = "../yr-sim" }
winit = "0.30"
pixels = "0.15"
cpal = "0.18.2"
font8x8 = "0.3.1"
infinitier_bik_decoder = "=0.0.17"
