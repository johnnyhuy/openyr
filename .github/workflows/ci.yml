name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    # The arm64 pool failed runner acquisition in #184 before any steps ran.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install project tools
        uses: jdx/mise-action@v3
        with:
          version: 2026.11.3

      - name: Test proof build provenance
        run: mise run test:proof

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: mise run fmt

      - name: Build public Win32 observation helpers
        run: |
          python3 -m py_compile tools/wine-oracle/oracle.py
          mkdir -p "$RUNNER_TEMP/wine-oracle-prefix/drive_c"
          python3 tools/wine-oracle/oracle.py build \
            --prefix "$RUNNER_TEMP/wine-oracle-prefix" \
            --out "$RUNNER_TEMP/wine-oracle-build"

      - name: Test renderer export observation
        run: python3 -m unittest discover -s tools/wine-oracle -p 'test_*.py' -v

      - name: Clippy (warnings denied)
        run: mise run clippy

      - name: Test
        # Retail-corpus tests self-skip: CI has no game install (never commit assets).
        run: mise run test
