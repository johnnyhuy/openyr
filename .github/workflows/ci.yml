name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Build public Win32 observation helpers
        run: |
          python3 -m py_compile tools/wine-oracle/oracle.py
          mkdir -p "$RUNNER_TEMP/wine-oracle-prefix/drive_c"
          python3 tools/wine-oracle/oracle.py build \
            --prefix "$RUNNER_TEMP/wine-oracle-prefix" \
            --out "$RUNNER_TEMP/wine-oracle-build"

      - name: Test renderer export observation
        run: python3 -m unittest discover -s tools/wine-oracle -p 'test_*.py' -v

      - name: Clippy (warnings denied)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        # Retail-corpus tests self-skip: CI has no game install (never commit assets).
        run: cargo test --workspace
